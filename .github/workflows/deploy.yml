name: Deploy main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the accepted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Verify the accepted revision
        run: make verify

      - name: Build the deployment artifact
        env:
          DOUBLANGU_BUILD_VERSION: ${{ github.sha }}
        run: |
          tools/build_release.sh "$RUNNER_TEMP/release.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum release.tar.gz > release.tar.gz.sha256

      - name: Upload the deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doublangu-release
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Activate verified release
    needs: build
    runs-on:
      - self-hosted
      - linux
      - arm64
      - doublangu-deploy
    timeout-minutes: 10
    steps:
      - name: Download the verified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: doublangu-release
          path: ${{ runner.temp }}/doublangu-release

      - name: Verify the artifact checksum
        working-directory: ${{ runner.temp }}/doublangu-release
        run: sha256sum --check release.tar.gz.sha256

      - name: Activate the release
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/doublangu-release/release.tar.gz
        run: sudo -n /usr/local/sbin/deploy-doublangu-release "$RELEASE_ARCHIVE" "$GITHUB_SHA"
