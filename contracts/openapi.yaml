        profile: { $ref: "#/components/schemas/SpeechProfile" }
        limits: { $ref: "#/components/schemas/AudioLimits" }
        operation: { type: string, enum: [chat_completion, list_models], description: "Present only for llm.relay.v1 leases." }
        relay: { type: object, description: "Validated relay request payload excluding protocol_version and operation. Present only for llm.relay.v1 leases." }

    WorkerHeartbeat:
      type: object
      additionalProperties: false
      required: [protocol_version, attempt, progress_percent]
      properties:
        protocol_version: { type: string, enum: [speech-worker.v1] }
        attempt: { type: integer, minimum: 1, maximum: 3 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }

    WorkerHeartbeatResponse:
      type: object
      required: [protocol_version, cancel_requested, lease_expires_at, progress_percent]
      properties:
        protocol_version: { type: string, enum: [speech-worker.v1] }
        cancel_requested: { type: boolean }
        lease_expires_at: { type: string }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }

    WorkerFailure:
      type: object
      additionalProperties: false
      required: [protocol_version, attempt, error_code, retry]
      properties:
        protocol_version: { type: string, enum: [speech-worker.v1] }
        attempt: { type: integer, minimum: 1, maximum: 3 }
        error_code: { type: string, pattern: '^v1\.[a-z0-9._-]+$', description: "Relay jobs accept only v1.relay_unreachable (retry allowed), v1.relay_auth, v1.relay_invalid_response, v1.relay_model_unknown, and v1.relay_canceled (retry forbidden)." }
        retry: { type: boolean }

    WorkerCompleteMetadata:
      type: object
      additionalProperties: false
      required: [protocol_version, attempt, lease_token]
      properties:
        protocol_version: { type: string, enum: [speech-worker.v1] }
        attempt: { type: integer, minimum: 1, maximum: 3 }
        lease_token: { type: string }
        artifact:
          type: object
          additionalProperties: false
          required: [request_hash, sha256, size_bytes, mime_type, codec, sample_rate_hz, channels, duration_ms]
          properties:
            request_hash: { $ref: "#/components/schemas/SHA256" }
            sha256: { $ref: "#/components/schemas/SHA256" }
            size_bytes: { type: integer, format: int64, minimum: 1 }
            mime_type: { type: string, enum: [audio/mp4] }
            codec: { type: string, enum: [aac-lc] }
            sample_rate_hz: { type: integer, enum: [24000] }
            channels: { type: integer, enum: [1] }
            duration_ms: { type: integer, format: int64, minimum: 1 }

    # --- Library domain schemas ---

    Library:
      type: object
      required: [id, name, source_language, target_language, created_at, updated_at]
      properties:
        id:          { $ref: "#/components/schemas/ULID" }
