openapi: "3.0.3"
info:
  title: Doublangu API
  version: "v1"
  description: |
    Single-owner language-learning media system. JSON API endpoints return
    structured error envelopes for non-2xx responses; plugin asset file
    responses retain their content-serving contract.
servers:
  - url: http://localhost:8080
    description: Local development server.

paths:
  /live:
    get:
      summary: Liveness check
      description: Returns 200 OK as long as the server can respond.
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /ready:
    get:
      summary: Readiness check
      description: |
        Checks database connectivity. Returns 200 OK when healthy,
        503 Service Unavailable when degraded.
      responses:
        "200":
          description: All checks pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /health:
    get:
      summary: Plugin diagnostics
      description: Returns owner-only core and loader readiness plus plugin counts.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Diagnostics report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsReport"
        "401":
          description: Owner authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /api/v1/auth/login:
    post:
      summary: Authenticate as the single owner
      description: |
        Requires a CSRF token (X-CSRF-Token header + csrf_token cookie).
        Rate-limited to 5 attempts per minute per IP.
        Sets doublangu_session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: Owner password.
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "400":
          description: Invalid JSON request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Session or CSRF refresh failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /api/v1/auth/csrf:
    get:
      summary: Bootstrap browser CSRF protection
      description: |
        Issues the same-origin csrf_token cookie required by login and logout.
        The token is read by the browser and echoed in X-CSRF-Token.
      responses:
        "200":
          description: CSRF cookie issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OKResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: CSRF bootstrap failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /api/v1/auth/logout:
    post:
      summary: End the current session
      description: |
        Requires the same CSRF cookie/header pair as login. Deletes the session
        from the database and clears the cookie after CSRF validation.
      responses:
        "200":
          description: Logout complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OKResponse"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Session deletion failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /api/v1/auth/session:
    get:
      summary: Check session validity
      description: Returns whether the current doublangu_session cookie is valid.
      responses:
        "200":
          description: Session status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /api/v1/ui/contributions:
    get:
      summary: Read enabled UI plugin contributions
      description: Requires an authenticated owner session.
      responses:
        "200":
          description: Versioned plugin contribution snapshot.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Owner session required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: Contribution registry failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  # --- Analysis settings and owner diagnostics ---

  /api/v1/analysis/providers:
    get:
      summary: List configured analysis providers with live health and model catalogs
      description: >-
        Without query parameters every provider renders from its last-good
        catalog. `refresh=true` requires one valid `provider_id` and forces a
        live refresh of only that provider; the listing also carries the
        latest retained conformance result per tested
        provider/stage/model/options tuple.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: refresh
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: provider_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Provider descriptors with optional model catalogs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProvidersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/analysis/providers/{id}/test:
    post:
      summary: Run the fixed conformance source through one stage of a provider
      description: >-
        Executes the real stage against the fixed safe fixture and returns only
        status, duration, and a stable error code. Options are canonicalized
        for the provider type; the provider must be enabled. The outcome is
        retained as the latest in-memory result for its
        provider/stage/model/options tuple and returned with the providers
        listing.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisProviderTestRequest" }
      responses:
        "200":
          description: Fixture result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProviderTestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/analysis/profiles:
    get:
      summary: List analysis profiles
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: All stored profiles with their bindings and active flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProfileListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    post:
      summary: Create an analysis profile
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisProfileInput" }
      responses:
        "201":
          description: The created profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/analysis/profiles/{id}:
    get:
      summary: Get one analysis profile
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    put:
      summary: Replace an analysis profile
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisProfileInput" }
      responses:
        "200":
          description: The replaced profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    delete:
      summary: Delete an analysis profile
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile was deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/analysis/settings:
    get:
      summary: Get the active analysis profile
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current active profile selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisPipelineSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    put:
      summary: Set the active analysis profile
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalysisPipelineSettingsInput" }
      responses:
        "200":
          description: Saved selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisPipelineSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/reader/settings:
    get:
      summary: Get the owner-wide reader preference
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current owner reader preference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReaderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
    put:
      summary: Save the owner-wide reader preference
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReaderSettingsInput" }
      responses:
        "200":
          description: Saved owner reader preference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReaderSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/analysis/runs:
    get:
      summary: List retained owner-visible analysis runs
      security: [{ sessionCookie: [] }]
      parameters:
        - name: article_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ULID" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Cursor-paginated analysis run summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisRunsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/analysis/runs/{id}:
    get:
      summary: Get one analysis run and its retained turn artifacts
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "200":
          description: Owner-visible run provenance, prompts, schemas, responses, and validation diagnostics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  # --- Article reader endpoints ---
  # All reader routes require an authenticated owner session. Mutations also
  # require the CSRF double-submit cookie/header pair.

  /api/v1/articles:
    get:
      summary: List saved reader articles
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Article summaries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      summary: Save a pasted reader article
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreate"
      responses:
        "201":
          description: Article saved immediately with background semantic analysis queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/articles/{id}:
    get:
      summary: Get a reader article
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "200":
          description: Article with ordered blocks and annotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/articles/{id}/enrich:
    post:
      summary: Queue reader analysis (compatibility alias)
      description: Deprecated compatibility alias for reanalyze. Returns immediately with a queued article.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "202":
          description: Article queued for background analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/articles/{id}/reanalyze:
    post:
      summary: Queue explicit background article reanalysis
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReanalyzeInput" }
      responses:
        "202":
          description: New analysis work was queued; an older accepted analysis remains readable until replacement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/articles/{id}/narration:
    get:
      summary: Get the ordered sentence narration manifest
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "200":
          description: Narration status and ordered sentence clips.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Narration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      summary: Queue narration regeneration
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "202":
          description: Missing or purged sentence renders were queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      summary: Clear article narration storage
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "200":
          description: Narration bindings cleared and orphaned long-form bytes reclaimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NarrationClearResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/learning-state:
    put:
      summary: Set an article annotation learning state
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SemanticLearningStateInput"
                - $ref: "#/components/schemas/LearningStateInput"
      responses:
        "200":
          description: Stored sense-keyed or legacy compatibility learning state.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SemanticLearningState"
                  - $ref: "#/components/schemas/LearningState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/audio/{id}:
    get:
      summary: Stream a ready authenticated speech render
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: Range
          in: header
          required: false
          schema: { $ref: "#/components/schemas/SingleByteRange" }
        - name: If-None-Match
          in: header
          required: false
          schema: { $ref: "#/components/schemas/ConditionalETag" }
      responses:
        "200":
          description: M4A audio bytes.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
            Content-Length: { schema: { $ref: "#/components/schemas/ByteLength" } }
            X-Accel-Redirect: { schema: { $ref: "#/components/schemas/InternalRedirectURI" } }
          content:
            audio/mp4: { schema: { type: string, format: binary } }
        "206":
          description: Partial M4A audio bytes.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
            Content-Range: { schema: { $ref: "#/components/schemas/ContentByteRange" } }
            Content-Length: { schema: { $ref: "#/components/schemas/ByteLength" } }
            X-Accel-Redirect: { schema: { $ref: "#/components/schemas/InternalRedirectURI" } }
          content:
            audio/mp4: { schema: { type: string, format: binary } }
        "304":
          description: Not modified.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "416":
          description: Range not satisfiable.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
            Content-Range: { schema: { $ref: "#/components/schemas/ContentByteRange" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/APIError" } }
        "500": { $ref: "#/components/responses/Internal" }
    head:
      summary: Get speech render headers without a body
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: Range
          in: header
          required: false
          schema: { $ref: "#/components/schemas/SingleByteRange" }
        - name: If-None-Match
          in: header
          required: false
          schema: { $ref: "#/components/schemas/ConditionalETag" }
      responses:
        "200":
          description: Speech render headers.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
            Content-Length: { schema: { $ref: "#/components/schemas/ByteLength" } }
            X-Accel-Redirect: { schema: { $ref: "#/components/schemas/InternalRedirectURI" } }
        "206":
          description: Partial speech render headers.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
            Content-Range: { schema: { $ref: "#/components/schemas/ContentByteRange" } }
            Content-Length: { schema: { $ref: "#/components/schemas/ByteLength" } }
            X-Accel-Redirect: { schema: { $ref: "#/components/schemas/InternalRedirectURI" } }
        "304":
          description: Not modified.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "416":
          description: Range not satisfiable.
          headers:
            ETag: { schema: { $ref: "#/components/schemas/StrongSHA256ETag" } }
            Content-Type: { schema: { $ref: "#/components/schemas/MediaType" } }
            Accept-Ranges: { schema: { $ref: "#/components/schemas/ByteRangeUnit" } }
            Content-Range: { schema: { $ref: "#/components/schemas/ContentByteRange" } }
          content:
            application/json: { schema: { $ref: "#/components/schemas/APIError" } }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/speech-workers/enrollments:
    post:
      summary: Create a one-time speech worker enrollment secret
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201":
          description: Secret displayed once to the owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/speech-workers:
    get:
      summary: List enrolled speech workers
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Worker status without credential hashes.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SpeechWorker" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/speech-workers/{id}:
    delete:
      summary: Revoke a speech worker and return its leases to the queue
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
      responses:
        "200": { description: Worker revoked., content: { application/json: { schema: { $ref: "#/components/schemas/OKResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/speech-worker/enroll:
    post:
      summary: Exchange a one-time secret for a worker credential
      parameters:
        - name: X-Doublangu-Enrollment-Token
          in: header
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerEnrollmentRequest" }
      responses:
        "201":
          description: Worker credential; shown only during enrollment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerEnrollmentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Invalid or expired enrollment secret., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }

  /api/v1/speech-worker/lease:
    post:
      summary: Long-poll and lease one compatible speech job
      parameters:
        - name: X-Doublangu-Worker-Token
          in: header
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerLeaseRequest" }
      responses:
        "200":
          description: One leased render job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerLease" }
        "204": { description: No compatible work before the long-poll deadline. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Worker credential required., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }

  /api/v1/speech-worker/jobs/{id}/heartbeat:
    post:
      summary: Renew a speech job lease
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: X-Doublangu-Worker-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-Doublangu-Lease-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerHeartbeat" }
      responses:
        "200": { description: Lease renewed., content: { application/json: { schema: { $ref: "#/components/schemas/WorkerHeartbeatResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Worker credential required., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }
        "409": { description: Lease expired or canceled., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }

  /api/v1/speech-worker/jobs/{id}/complete:
    post:
      summary: Upload and atomically publish a speech render or relay result
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: X-Doublangu-Worker-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata]
              additionalProperties: false
              properties:
                metadata: { type: string, description: JSON matching WorkerCompleteMetadata. }
                audio: { type: string, format: binary, description: "Required for TTS jobs; forbidden for llm.relay.v1 jobs." }
                result: { type: string, description: "Required JSON for llm.relay.v1 jobs; forbidden for TTS jobs." }
      responses:
        "200": { description: Render accepted., content: { application/json: { schema: { $ref: "#/components/schemas/OKResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Worker credential required., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }
        "409": { description: Stale lease or nondeterministic result., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }
        "413": { description: Audio exceeds the unit limit., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }
        "422": { description: Audio metadata or bytes failed validation., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }

  /api/v1/speech-worker/jobs/{id}/fail:
    post:
      summary: Record a sanitized speech generation failure
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: X-Doublangu-Worker-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-Doublangu-Lease-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerFailure" }
      responses:
        "200": { description: Failure recorded., content: { application/json: { schema: { $ref: "#/components/schemas/OKResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Worker credential required., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }
        "409": { description: Lease expired., content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } } }

