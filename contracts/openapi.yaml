  # --- Media endpoint ---
  /api/v1/media/{id}:
    get:
      summary: Download media bytes
      description: |
        Returns the content-addressed blob for a source asset. Supports
        byte-range requests (Range header), conditional requests
        (If-None-Match), and ETag based on SHA-256 digest.
        When X-Accel-Redirect is configured the server returns an internal
        redirect header instead of streaming bytes directly.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: Source asset ULID.
          schema: { $ref: "#/components/schemas/ULID" }
        - name: Range
          in: header
          required: false
          schema: { $ref: "#/components/schemas/SingleByteRange" }
          example: bytes=0-1023
        - name: If-None-Match
          in: header
          required: false
          schema: { $ref: "#/components/schemas/ConditionalETag" }
      responses:
        "200":
          description: Full media bytes.
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
            Content-Length:
              schema: { $ref: "#/components/schemas/ByteLength" }
            X-Accel-Redirect:
              description: Optional opaque internal redirect location.
              schema: { $ref: "#/components/schemas/InternalRedirectURI" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial content (byte range).
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
            Content-Range:
              schema: { $ref: "#/components/schemas/ContentByteRange" }
            Content-Length:
              schema: { $ref: "#/components/schemas/ByteLength" }
            X-Accel-Redirect:
              description: Optional opaque internal redirect location.
              schema: { $ref: "#/components/schemas/InternalRedirectURI" }
        "304":
          description: Not modified (If-None-Match).
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "416":
          description: Range not satisfiable.
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
            Content-Range:
              schema: { $ref: "#/components/schemas/ContentByteRange" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          $ref: "#/components/responses/Internal"
    head:
      summary: Media metadata (no body)
      description: Same headers as GET without the response body.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ULID" }
        - name: Range
          in: header
          required: false
          schema: { $ref: "#/components/schemas/SingleByteRange" }
        - name: If-None-Match
          in: header
          required: false
          schema: { $ref: "#/components/schemas/ConditionalETag" }
      responses:
        "200":
          description: Media metadata.
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
            Content-Length:
              schema: { $ref: "#/components/schemas/ByteLength" }
            X-Accel-Redirect:
              description: Optional opaque internal redirect location.
              schema: { $ref: "#/components/schemas/InternalRedirectURI" }
        "206":
          description: Partial media metadata.
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
            Content-Range:
              schema: { $ref: "#/components/schemas/ContentByteRange" }
            Content-Length:
              schema: { $ref: "#/components/schemas/ByteLength" }
            X-Accel-Redirect:
              description: Optional opaque internal redirect location.
              schema: { $ref: "#/components/schemas/InternalRedirectURI" }
        "304":
          description: Not modified (If-None-Match).
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "416":
          description: Range not satisfiable.
          headers:
            ETag:
              schema: { $ref: "#/components/schemas/StrongSHA256ETag" }
            Content-Type:
              schema: { $ref: "#/components/schemas/MediaType" }
            Accept-Ranges:
              schema: { $ref: "#/components/schemas/ByteRangeUnit" }
            Content-Range:
              schema: { $ref: "#/components/schemas/ContentByteRange" }
        "500":
          $ref: "#/components/responses/Internal"
components:
  schemas:
    APIError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Versioned machine-readable error code (for example v1.csrf_error).

    ULID:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: Canonical uppercase Crockford ULID.

    SHA256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Lowercase hexadecimal SHA-256 digest.

    SingleByteRange:
      type: string
      pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
      description: One HTTP byte range; multiple ranges are not accepted.

    ConditionalETag:
      type: string
      minLength: 1
      description: If-None-Match input; strong, weak, list, and wildcard forms are accepted.

    StrongSHA256ETag:
      type: string
      pattern: '^"[0-9a-f]{64}"$'
      description: Strong quoted ETag derived from the lowercase SHA-256 digest.

    MediaType:
      type: string
      minLength: 1
      description: Stored source-asset media value returned verbatim as Content-Type; production does not enforce MIME type/subtype structure.

    ByteRangeUnit:
      type: string
      enum: [bytes]

    ByteLength:
      type: integer
      format: int64
      minimum: 0

    ContentByteRange:
      type: string
      pattern: '^bytes (?:[0-9]+-[0-9]+/[0-9]+|\*/[0-9]+)$'

    InternalRedirectURI:
      type: string
      pattern: '^/[^\r\n]*$'
      description: Opaque validated same-origin internal redirect URI, never a filesystem path.

    LanguageTag:
      type: string
      minLength: 2
      pattern: '^[A-Za-z][A-Za-z0-9-]+$'
      description: |
        BCP-47 syntactic pre-check only. Canonical acceptance and normalization
        are decided by the production BCP-47 parser.

    Milliseconds:
      type: integer
      format: int64
      minimum: 0
      description: Non-negative timing value; when start_ms and end_ms coexist, end_ms must be at least start_ms.

    OKResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object
          additionalProperties:
            type: string
        database:
          type: string

    DiagnosticsReport:
      type: object
      properties:
        core_ready:
          type: boolean
        loader_ready:
          type: boolean
        schema_available:
          type: boolean
        registry_state:
          type: string
        plugin_count:
          type: integer
        registration_count:
          type: integer
        plugin_ids:
          type: array
          items:
            type: string

    LoginResponse:
      type: object
      properties:
        ok:
          type: boolean

    # --- Article reader schemas ---

    AnnotationKind:
      type: string
      enum: [word, phrase, idiom, expression, proverb]

    EnrichmentStatus:
      type: string
      enum: [draft, processing, ready, failed]

    AnalysisStatus:
      type: string
      enum: [needs_analysis, queued, processing, ready, failed]

    ReasoningEffort:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 1 }
        description: { type: string }

    AnalysisProvidersResponse:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/AnalysisProvider" }
    AnalysisProvider:
      type: object
      additionalProperties: false
      required: [id, type, enabled, stale, health]
      properties:
        id: { type: string }
        label: { type: string }
        endpoint_label: { type: string }
        type: { type: string }
        enabled: { type: boolean }
        stale: { type: boolean }
        retrieved_at: { type: string }
        last_error: { type: string }
        health:
          type: string
          enum: [disabled, healthy, unhealthy, unknown]
        models:
          type: array
          items: { $ref: "#/components/schemas/AnalysisProviderModel" }
        conformance:
          type: array
          items: { $ref: "#/components/schemas/AnalysisConformanceSummary" }
    AnalysisConformanceSummary:
      type: object
      additionalProperties: false
      required: [stage_id, model_id, status, checked_at, duration_ms]
      properties:
        stage_id:
          type: string
          enum: [linguistic_analysis, translation]
        model_id: { type: string }
        options: { type: object }
        status:
          type: string
          enum: [healthy, unhealthy]
        checked_at: { type: string }
        duration_ms: { type: integer, format: int64 }
        error_code: { type: string }
    AnalysisProviderModel:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        display_name: { type: string }
        supported_reasoning_efforts:
          type: array
          items: { $ref: "#/components/schemas/ReasoningEffort" }
    AnalysisProviderTestRequest:
      type: object
      additionalProperties: false
      required: [stage_id, model_id, options]
      properties:
        stage_id:
          type: string
          enum: [linguistic_analysis, translation]
        model_id: { type: string }
        options: { type: object }
    AnalysisProviderTestResponse:
      type: object
      additionalProperties: false
      required: [status, duration_ms]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        duration_ms: { type: integer, format: int64 }
        error_code: { type: string }
    AnalysisProfileInput:
      type: object
      additionalProperties: false
      required: [name, bindings]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AnalysisProfileBindingInput" }
    AnalysisProfileBindingInput:
      type: object
      additionalProperties: false
      required: [stage_id, provider_id, model_id, options]
      properties:
        stage_id:
          type: string
          enum: [linguistic_analysis, translation]
        provider_id: { type: string }
        model_id: { type: string }
        options: { type: object }
    AnalysisProfileSnapshot:
      type: object
      additionalProperties: false
      required: [id, name, bindings]
      description: The exact immutable provider profile used by a run.
      properties:
        id: { type: string }
        name: { type: string }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AnalysisProfileSnapshotBinding" }
    AnalysisProfileSnapshotBinding:
      type: object
      additionalProperties: false
      required: [stage_id, provider_id, provider_type, provider_config_fingerprint,
        model_id, options, options_hash, contract_version, prompt_version]
      properties:
        stage_id:
          type: string
          enum: [linguistic_analysis, translation]
        provider_id: { type: string }
        provider_type: { type: string }
        provider_config_fingerprint: { type: string }
        model_id: { type: string }
        options: { type: object }
        options_hash: { type: string }
        contract_version: { type: string }
        prompt_version: { type: string }
    AnalysisProfileBinding:
      type: object
      additionalProperties: false
      required: [stage_id, provider_id, model_id, options]
      properties:
        stage_id:
          type: string
          enum: [linguistic_analysis, translation]
        provider_id: { type: string }
        model_id: { type: string }
        options: { type: object }
        valid:
          type: boolean
          description: >-
            Whether the stored binding is still usable against the current
            provider registry and model catalog. Omitted on write; present on
            profile reads.
        validity_reason:
          type: string
          description: Sanitized reason when valid is false; omitted otherwise.
    AnalysisProfile:
      type: object
      additionalProperties: false
      required: [id, name, bindings, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AnalysisProfileBinding" }
        is_active: { type: boolean }
    AnalysisProfileListResponse:
      type: object
      additionalProperties: false
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/AnalysisProfile" }
    AnalysisPipelineSettings:
      type: object
      additionalProperties: false
      required: [active_profile_id]
      properties:
        active_profile_id: { type: string }
        updated_at: { type: string }
    AnalysisPipelineSettingsInput:
      type: object
      additionalProperties: false
      required: [active_profile_id]
      properties:
        active_profile_id: { type: string }
    AnalysisTurn:
      type: object
      additionalProperties: false
      required: [id, run_id, block_index, turn_index, turn_kind, prompt, output_schema,
        completed_response, response_hash, validation_error, provider_error,
        completion_metadata_json, provider_stderr_excerpt, started_at, completed_at,
        duration_ms, status]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        run_id: { $ref: "#/components/schemas/ULID" }
        block_index: { type: integer, minimum: 0 }
        turn_index: { type: integer, minimum: 0 }
        turn_kind: { type: string, enum: [initial, corrective] }
        prompt: { type: string, minLength: 1 }
        output_schema: { type: string, minLength: 1 }
        completed_response: { type: string }
        response_hash: { type: string }
        validation_error: { type: string }
        provider_error: { type: string }
        completion_metadata_json: { type: string }
        provider_stderr_excerpt: { type: string }
        started_at: { type: string }
        completed_at: { type: string }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [completed, failed] }

    AnalysisRunSummary:
      type: object
      additionalProperties: false
      required: [id, article_id, article_title, attempt_count, requested_model,
        requested_effort, status, total_paragraphs, completed_paragraphs,
        failed_block_index, duration_ms, started_at, completed_at, error_code]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        article_id: { $ref: "#/components/schemas/ULID" }
        article_title: { type: string }
        attempt_count: { type: integer, minimum: 1 }
        requested_model: { type: string }
        requested_effort: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        total_paragraphs: { type: integer, minimum: 0 }
        completed_paragraphs: { type: integer, minimum: 0 }
        failed_block_index: { type: integer, minimum: -1 }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        started_at: { type: string }
        completed_at: { type: string }
        error_code: { type: string }
        profile_id: { type: string }
        profile_name: { type: string }
        profile_snapshot_hash: { type: string }
        bindings:
          type: array
          items: { $ref: "#/components/schemas/AnalysisRunBinding" }
    AnalysisRunBinding:
      type: object
      additionalProperties: false
      required: [stage_id, provider_id, model_id]
      properties:
        stage_id:
          type: string
          enum: [linguistic_analysis, translation]
        provider_id: { type: string }
        model_id: { type: string }

    AnalysisRun:
      type: object
      additionalProperties: false
      required: [id, article_id, article_title, job_id, attempt_count, content_hash,
        contract_version, prompt_version, requested_model, requested_effort,
        provider_id, codex_cli_version, reported_model, started_at, completed_at,
        duration_ms, status, total_paragraphs, completed_paragraphs,
        failed_block_index, error_code, stderr_excerpt, turns]
      properties:
        id: { $ref: "#/components/schemas/ULID" }
        article_id: { $ref: "#/components/schemas/ULID" }
        article_title: { type: string }
        job_id: { $ref: "#/components/schemas/ULID" }
        attempt_count: { type: integer, minimum: 1 }
        content_hash: { $ref: "#/components/schemas/SHA256" }
        contract_version: { type: string }
        prompt_version: { type: string }
        requested_model: { type: string }
        requested_effort: { type: string }
